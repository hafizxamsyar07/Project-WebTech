<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Books - SmartBookStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bookstyle.css">
</head>

<body>
  <header class="navbar">
    <a href="index.html" class="logo">SmartBookStore</a>

    <div class="header-right">
      <div class="search-box">
        <input type="text" id="bookSearch" placeholder="Search books...">
        <div id="suggestionBox"></div>
      </div>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="books.html" class="active">Books</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="cart.html">Cart</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="books-page">
    <section class="books-hero">
      <div>
        <span class="books-label">Book Collection</span>
        <h1>Browse all books</h1>
        <p>Books are loaded from JSON, with an API fallback when needed.</p>
      </div>

      <div class="book-controls">
        <label class="book-filter">
          <span>Category</span>
          <select id="bookCategorySelect" onchange="filterBookPage(this.value)">
            <option value="all">All categories</option>
          </select>
        </label>

        <label class="book-filter">
          <span>Sort by</span>
          <select id="bookSortSelect" onchange="sortBookPage(this.value)">
            <option value="featured">Featured</option>
            <option value="relevant">Most relevant</option>
            <option value="best-selling">Best selling</option>
            <option value="az">Alphabetically, A-Z</option>
            <option value="za">Alphabetically, Z-A</option>
            <option value="price-low">Price, low to high</option>
            <option value="price-high">Price, high to low</option>
            <option value="date-old">Date, old to new</option>
            <option value="date-new">Date, new to old</option>
          </select>
        </label>
      </div>
    </section>

    <section class="books-recommendation-section">
      <div class="books-section-heading">
        <span class="books-label">Recommended</span>
        <h2>Top picks for you</h2>
      </div>
      <div class="recommendation-row" id="booksRecommendation"></div>
    </section>

    <div class="books-section-heading all-books-heading">
      <span class="books-label">All Books</span>
      <h2>Filterable collection</h2>
    </div>

    <section id="categoryBooks" class="books"></section>
  </main>

  <script src="script.js"></script>

  <footer class="footer">
    <p>&copy; 2026 SmartBookStore</p>
    <p>Built for educational purpose</p>
  </footer>

  <div id="toast"></div>
</body>
</html>
